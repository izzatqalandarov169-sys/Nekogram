name: Build Nekogram APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build Arm64 APK
      run: ./gradlew assembleDebug -PabiFilters=arm64-v8a --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Nekogram-APK
        path: TMessagesProj/build/outputs/apk/**/*.apk
        
