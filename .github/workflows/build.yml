name: Build Nekogram APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Python 2 skriptlaridagi SyntaxError xatolarini e'tiborsiz qoldirish uchun bayroq
      - name: Build APK
        run: ./gradlew assembleDebug -x compileLint -Dorg.gradle.python.ignore=true --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nekogram-APK
          path: |
            **/build/outputs/apk/**/*.apk
            
