name: Build Nekogram APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Telegram/Nekogram loyihalari JDK 17 da barqaror ishlaydi
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Gradle Wrapper'ning o'zidan foydalanish (Yangi Gradle 9.x ishlatmasligi uchun)
      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --continue

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nekogram-APK
          path: |
            **/build/outputs/apk/release/*.apk
            **/build/outputs/apk/*/*.apk
            
